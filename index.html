<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placas de desarrollo — Arduino · ESP32 · Raspberry Pi</title>
<style>
  :root{
    --dark:#2E2B26;
    --darker:#221F1B;
    --paper:#F2EEE3;
    --paper2:#EAE4D6;
    --gray:#8A8175;
    --ink:#2B2A26;
    --muted:#716B62;
    --arduino:#9C6B44;
    --esp32:#5F717A;
    --rpi:#6C7658;
    --white:#FFFFFF;
    --line:#C9C0AE;
    box-sizing:border-box;
  }
  *{box-sizing:inherit;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:"SF Mono",Consolas,"Courier New",monospace; }
  .serif{ font-family:Cambria,Georgia,"Times New Roman",serif; }

  /* breadboard dot texture */
  .board-bg{
    background-image: radial-gradient(var(--line) 1px, transparent 1.4px);
    background-size: 22px 22px;
    background-position: -4px -4px;
  }

  #app{ min-height:100vh; display:flex; flex-direction:column; }

  header.topbar{
    padding: 14px clamp(16px,4vw,48px);
    display:flex; align-items:center; justify-content:space-between;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky; top:0; z-index: 20;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-chip{
    width:30px; height:30px; border-radius:6px;
    background: var(--dark);
    display:flex; align-items:center; justify-content:center;
    color:var(--paper); font-size:14px; font-weight:700;
  }
  .brand-text{ font-size:13px; letter-spacing:.02em; color:var(--muted); }
  .brand-text b{ color:var(--ink); }

  .progress-wrap{ display:flex; align-items:center; gap:10px; }
  .progress-track{
    width: clamp(90px,22vw,220px); height:6px; border-radius:3px;
    background: var(--paper2); overflow:hidden; border:1px solid var(--line);
  }
  .progress-fill{ height:100%; background:var(--dark); width:0%; transition:width .35s ease; }
  .progress-label{ font-size:12px; color:var(--muted); min-width:52px; text-align:right; }

  main#stage{
    flex:1; display:flex; align-items:stretch; justify-content:center;
    padding: clamp(18px,4vw,40px) clamp(16px,5vw,48px) 10px;
  }
  .slide{
    width:100%; max-width: 900px; margin:0 auto;
    animation: rise .38s ease;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .slide{ animation:none; } }

  footer.navbar{
    padding: 14px clamp(16px,4vw,48px) calc(14px + env(safe-area-inset-bottom,0px));
    display:flex; align-items:center; justify-content:space-between;
    border-top: 1px solid var(--line);
    background: var(--paper);
    position: sticky; bottom:0;
  }
  .btn{
    font-family:inherit; font-size:14.5px; font-weight:600;
    padding:10px 20px; border-radius:5px; border:1.5px solid var(--dark);
    background:transparent; color:var(--dark); cursor:pointer;
    transition: background .15s ease, color .15s ease, opacity .15s ease;
  }
  .btn:hover:not(:disabled){ background:var(--dark); color:var(--paper); }
  .btn:disabled{ opacity:.32; cursor:not-allowed; }
  .btn.primary{ background:var(--dark); color:var(--paper); }
  .btn.primary:hover:not(:disabled){ background:var(--darker); }
  .nav-hint{ font-size:12px; color:var(--muted); text-align:center; }

  /* ---------- Cover ---------- */
  .cover{
    min-height: calc(100vh - 150px);
    display:flex; flex-direction:column; justify-content:center;
    border:1.5px dashed var(--line); border-radius:10px;
    padding: clamp(24px,6vw,64px);
  }
  .cover-eyebrow{ font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  .cover h1{ font-size: clamp(32px,6vw,54px); line-height:1.06; margin:0 0 14px; }
  .cover p.lead{ font-size:17px; color:var(--muted); max-width:520px; line-height:1.55; margin:0 0 26px; }
  .chip-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:30px; }
  .chip{ font-size:13px; padding:7px 13px; border-radius:20px; color:white; font-weight:600; }

  /* ---------- Content sections ---------- */
  .kicker{ font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  .kicker b{ color:var(--ink); }
  h2.title{ font-size: clamp(24px,4vw,32px); margin: 0 0 16px; line-height:1.15; }
  p.body-text{ font-size:16px; line-height:1.65; color:var(--ink); max-width: 68ch; }
  .callout{
    border-left:3px solid var(--dark); background: var(--paper2);
    padding: 14px 18px; margin: 18px 0; font-size:15px; line-height:1.55;
  }
  .callout b{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px; }

  .feature-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin:18px 0; }
  .feature{ border:1px solid var(--line); border-radius:8px; padding:14px 16px; background:var(--white); }
  .feature .f-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:5px; }
  .feature .f-title{ font-weight:700; font-size:15px; margin-bottom:4px; }
  .feature .f-desc{ font-size:13.5px; color:var(--muted); line-height:1.45; }

  /* ---------- Schematic ---------- */
  .schema-wrap{ border:1px solid var(--line); border-radius:8px; background:var(--white); padding:14px; margin:16px 0; }
  .schema-caption{ font-size:12px; color:var(--muted); text-align:center; margin-top:6px; }
  .schema-svg text{ font-family:"SF Mono",Consolas,monospace; }

  /* ---------- Question ---------- */
  .qbox{
    border:1.5px dashed var(--gray); border-radius:8px; padding: 22px clamp(16px,3vw,28px);
    background: var(--white);
  }
  .qtag{ font-size:12px; color:var(--white); background:var(--dark); display:inline-block; padding:3px 9px; border-radius:4px; margin-bottom:12px; }
  .qprompt{ font-size:18px; font-weight:600; line-height:1.4; margin:0 0 18px; }
  .options{ display:flex; flex-direction:column; gap:9px; margin-bottom: 6px; }
  .option{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--line); border-radius:6px; padding:11px 14px;
    cursor:pointer; background:var(--paper); font-size:14.5px;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover{ border-color:var(--dark); }
  .option .letter{
    width:24px; height:24px; border-radius:50%; border:1.5px solid var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none;
    font-family:"SF Mono",Consolas,monospace;
  }
  .option.selected{ border-color:var(--dark); background:var(--paper2); }
  .option.correct{ border-color:var(--rpi); background:#E7ECE0; }
  .option.correct .letter{ background:var(--rpi); border-color:var(--rpi); color:white; }
  .option.incorrect{ border-color:var(--arduino); background:#F3E7DE; }
  .option.incorrect .letter{ background:var(--arduino); border-color:var(--arduino); color:white; }
  .option.disabled{ cursor:default; }

  .feedback{ margin-top:16px; padding:14px 16px; border-radius:6px; font-size:14.5px; line-height:1.55; display:none; }
  .feedback.show{ display:block; }
  .feedback.ok{ background:#E7ECE0; border:1px solid var(--rpi); }
  .feedback.no{ background:#F3E7DE; border:1px solid var(--arduino); }
  .feedback b{ display:block; margin-bottom:4px; }

  /* ---------- Final ---------- */
  .score-hero{ text-align:center; padding: 30px 10px 10px; }
  .score-num{ font-size: clamp(56px,10vw,86px); font-weight:800; line-height:1; }
  .score-den{ font-size:20px; color:var(--muted); }
  .review-list{ margin-top:22px; display:flex; flex-direction:column; gap:8px; }
  .review-row{ display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:6px; padding:10px 14px; background:var(--white); font-size:13.5px; }
  .review-row .mark{ width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:white; font-size:11px; font-weight:800; }
  .mark.ok{ background:var(--rpi); }
  .mark.no{ background:var(--arduino); }

  table.cmp{ width:100%; border-collapse:collapse; margin:16px 0; font-size:14px; }
  table.cmp th, table.cmp td{ border:1px solid var(--line); padding:9px 12px; text-align:left; }
  table.cmp th{ background:var(--dark); color:var(--paper); font-weight:600; font-size:13px; }
  table.cmp tr:nth-child(even) td{ background: var(--paper2); }

  @media (max-width:640px){
    .progress-label{ display:none; }
    .cover h1{ font-size:30px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-chip mono">2.1</div>
      <div class="brand-text">Hardware para IoT <b>· Placas de desarrollo</b></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label mono" id="progressLabel">0 / 0</div>
    </div>
  </header>

  <main id="stage"></main>

  <footer class="navbar">
    <button class="btn" id="prevBtn">← Anterior</button>
    <div class="nav-hint" id="navHint"></div>
    <button class="btn primary" id="nextBtn">Siguiente →</button>
  </footer>
</div>

<script>
(function(){

  // ---------- Datos de las secciones ----------
  var sections = [];

  sections.push({ type:"cover" });

  sections.push({
    type:"content",
    kicker:"Fundamentos",
    title:"¿Qué es una placa de desarrollo?",
    html:
      '<p class="body-text">Una pequeña computadora o circuito diseñado para facilitar la creación de prototipos electrónicos. Incluye lo esencial para programar, conectar sensores/actuadores, y probar ideas rápidamente, sin tener que diseñar un circuito desde cero.</p>' +
      '<div class="callout"><b>Analogía</b>Es como una mesa de trabajo lista para usarse: no hay que soldar ni diseñar electrónica avanzada, la placa ya trae integrado lo esencial para que conectes tus ideas al mundo físico.</div>'
  });

  sections.push({
    type:"content",
    kicker:"Fundamentos",
    title:"Arquitectura general",
    html:
      '<p class="body-text">Casi cualquier placa de desarrollo repite las mismas 5 piezas, sin importar la marca o el modelo:</p>' +
      '<div class="feature-grid">' +
        feature("CPU","Microcontrolador","El chip que ejecuta el programa, una instrucción a la vez.") +
        feature("MEM","Memoria","Guarda el programa (flash) y los datos mientras corre (RAM).") +
        feature("PWR","Alimentación","Recibe energía por USB, batería o fuente externa.") +
        feature("NET","Conectividad","Wi-Fi, Bluetooth, USB u otro medio para comunicarse.") +
        feature("I/O","Pines GPIO","Entradas y salidas para conectar sensores y actuadores.") +
      '</div>'
  });

  sections.push({
    type:"content",
    kicker:"Fundamentos",
    title:"Microcontrolador vs microprocesador",
    html:
      '<p class="body-text">Antes de ver las 3 placas una por una, conviene entender la distinción más importante de toda la sesión: no todas las placas de desarrollo funcionan igual por dentro.</p>' +
      '<table class="cmp"><thead><tr><th></th><th>Microcontrolador</th><th>Microprocesador (SBC)</th></tr></thead><tbody>' +
      row3("Sistema operativo","No tiene","Corre uno completo (p. ej. Linux)") +
      row3("Programas a la vez","Uno solo, en bucle","Varios, en multitarea") +
      row3("Ejemplo de hoy","Arduino, ESP32","Raspberry Pi") +
      row3("Analogía","Un trabajador con una sola tarea fija","Un gerente que coordina varias tareas") +
      '</tbody></table>' +
      '<div class="callout"><b>Por qué importa</b>Esta diferencia explica casi todo lo demás: precio, consumo de energía, complejidad de programación y para qué sirve mejor cada placa.</div>'
  });

  // ---------- ARDUINO ----------
  sections.push({
    type:"content",
    kicker:"Placa 1 de 3", kickerColor:"arduino",
    title:"Arduino — el trabajador especializado",
    html:
      '<p class="body-text">Una plataforma de hardware libre basada en un microcontrolador: un solo chip que combina procesador, memoria y entradas/salidas. No tiene sistema operativo: ejecuta UN programa, una y otra vez, de forma muy confiable.</p>' +
      '<div class="callout"><b>Analogía</b>Es como un trabajador que hace siempre la misma tarea, muy bien y sin distraerse: no necesita instrucciones nuevas, solo energía y su tarea de siempre.</div>' +
      '<div class="feature-grid">' +
        feature("8-bit","Microcontrolador AVR (ATmega328P)","Chip sencillo, sin sistema operativo.") +
        feature("16 MHz","Velocidad de reloj","Suficiente para tareas de control simples.") +
        feature("32 KB","Memoria flash","Donde vive el programa; 2 KB de RAM y 1 KB de EEPROM.") +
        feature("I/O","14 pines digitales, 6 analógicos","6 de los digitales admiten salida PWM.") +
        feature("5V","Voltaje de operación","Típico en la familia Arduino Uno/Nano.") +
        feature("PWR","Muy bajo consumo","Puede funcionar meses con una pila.") +
      '</div>' +
      '<p class="body-text" style="margin-top:14px;"><em>Los valores exactos varían según el modelo de Arduino; los de arriba corresponden al Arduino Uno, el más usado para aprender.</em></p>' +
      '<div class="callout"><b>Origen y modelos</b>Arduino nació en 2005 en Ivrea, Italia, como un proyecto de hardware libre para hacer la electrónica accesible a estudiantes de diseño. Además del Uno existen otros modelos populares: Nano (más pequeño), Mega (muchos más pines) y Leonardo.</div>'
  });

  sections.push({
    type:"content",
    kicker:"Placa 1 de 3", kickerColor:"arduino",
    title:"Esquema de una placa Arduino",
    html: schemaWrap(svgArduino(), "Vista simplificada de una placa tipo Arduino Uno")
  });

  sections.push({
    type:"content",
    kicker:"Placa 1 de 3", kickerColor:"arduino",
    title:"Arduino: tabla de configuración de pines",
    html:
      '<p class="body-text">Cada pin del Arduino Uno tiene un rol definido. Esta es la referencia que usarás al conectar sensores y actuadores:</p>' +
      '<table class="cmp"><thead><tr><th>Pin</th><th>Tipo</th><th>Función</th></tr></thead><tbody>' +
      row3("D0 (RX) / D1 (TX)","Comunicación serial","Recibir/enviar datos por UART; evitar usarlos si el circuito ya usa el puerto USB.") +
      row3("D2, D3","Digital + interrupción","Entradas/salidas que además detectan cambios instantáneos (interrupciones).") +
      row3("D3, D5, D6, D9, D10, D11","Digital (PWM ~)","Simulan una salida analógica; ideales para regular brillo o velocidad de un motor.") +
      row3("D4, D7, D8, D12","Digital","Entrada o salida todo-o-nada (encendido/apagado).") +
      row3("D13","Digital","Tiene un LED integrado en la placa; útil para pruebas rápidas.") +
      row3("A0 – A5","Entrada analógica","Leen un valor entre 0 y 5V con 10 bits de resolución (0-1023); también sirven como digitales.") +
      row3("5V / 3.3V","Alimentación (salida)","Energía regulada para sensores externos.") +
      row3("GND","Tierra","Referencia común; todo sensor o actuador debe compartirla con la placa.") +
      row3("VIN","Alimentación (entrada)","Para alimentar la placa con una fuente externa de 7-12V.") +
      '</tbody></table>' +
      '<p class="body-text" style="margin-top:10px;"><em>El símbolo ~ junto a un número de pin, impreso en la propia placa, indica que admite PWM.</em></p>'
  });

  sections.push({
    type:"content",
    kicker:"Placa 1 de 3", kickerColor:"arduino",
    title:"Arduino: usos comunes",
    html:
      '<div class="feature-grid">' +
        feature("01","Lectura de sensores simples","Temperatura, humedad, luz, distancia.") +
        feature("02","Robots básicos","Control de motores y sensores de un robot educativo.") +
        feature("03","Automatización del hogar","Encender luces o riego según una condición.") +
        feature("04","Proyectos escolares","El punto de entrada más común a la electrónica.") +
      '</div>' +
      '<div class="callout"><b>Ejemplo práctico</b>Un Arduino con un sensor de humedad de suelo que enciende una pequeña bomba de agua cuando la tierra está muy seca. No necesita internet, ni mucha energía: solo cumple su tarea, una y otra vez.</div>'
  });

  // ---------- ESP32 ----------
  sections.push({
    type:"content",
    kicker:"Placa 2 de 3", kickerColor:"esp32",
    title:"ESP32 — el mensajero siempre conectado",
    html:
      '<p class="body-text">Un microcontrolador, como Arduino, pero con Wi-Fi y Bluetooth integrados de fábrica. Es más potente que un Arduino típico y está pensado específicamente para proyectos que necesitan conectarse a internet.</p>' +
      '<div class="callout"><b>Analogía</b>Es como un mensajero que, además de hacer su trabajo, siempre trae consigo un radio para avisar o recibir noticias al instante.</div>' +
      '<div class="feature-grid">' +
        feature("32-bit","Microcontrolador Xtensa","Varios modelos con doble núcleo.") +
        feature("240 MHz","Velocidad de reloj típica","Hasta varias veces más rápido que un Arduino Uno.") +
        feature("520 KB","SRAM","Más memoria de trabajo que Arduino; la flash varía (4 MB o más).") +
        feature("NET","Wi-Fi y Bluetooth integrados","802.11 b/g/n y Bluetooth clásico + BLE, sin módulos externos.") +
        feature("I/O","~34 pines GPIO utilizables","Incluye entradas analógicas y salidas PWM.") +
        feature("3.3V","Voltaje de operación","Distinto al de 5V de Arduino: hay que tenerlo en cuenta al conectar sensores.") +
      '</div>' +
      '<p class="body-text" style="margin-top:14px;"><em>El ESP32 es la evolución del popular ESP8266, hecho por la empresa Espressif; existen muchos modelos y variantes.</em></p>' +
      '<div class="callout"><b>Origen y modelos</b>Espressif Systems (China) lanzó el ESP32 en 2016. Hoy existen variantes como el ESP32-WROOM (la más común), el ESP32-S2, el ESP32-C3 (más económico, un solo núcleo) y el ESP32-S3, cada una con distintas capacidades de radio y número de pines.</div>'
  });

  sections.push({
    type:"content",
    kicker:"Placa 2 de 3", kickerColor:"esp32",
    title:"Esquema de una placa ESP32",
    html: schemaWrap(svgEsp32(), "Vista simplificada de una placa de desarrollo ESP32")
  });

  sections.push({
    type:"content",
    kicker:"Placa 2 de 3", kickerColor:"esp32",
    title:"ESP32: tabla de configuración de pines",
    html:
      '<p class="body-text">La distribución exacta de pines varía según el modelo de placa ESP32; esta tabla resume los roles típicos:</p>' +
      '<table class="cmp"><thead><tr><th>Pin(es)</th><th>Tipo</th><th>Función</th></tr></thead><tbody>' +
      row3("GPIO1 (TX0) / GPIO3 (RX0)","Comunicación serial","UART principal, usado también para programar la placa.") +
      row3("GPIO0","Digital / Boot","Determina el modo de arranque; mantenerlo en bajo entra en modo de programación.") +
      row3("GPIO2","Digital","En muchas placas controla el LED integrado.") +
      row3("GPIO32 – GPIO39","Entrada analógica (ADC1)","Lectura analógica de 12 bits; ideal para sensores.") +
      row3("GPIO25, GPIO26","Salida analógica (DAC)","De los pocos pines con salida analógica real, no solo PWM.") +
      row3("GPIO21 (SDA) / GPIO22 (SCL)","Bus I2C","Conexión por defecto para sensores I2C (pantallas, sensores múltiples en 2 cables).") +
      row3("GPIO18, 19, 23, 5","Bus SPI","Comunicación rápida con pantallas o tarjetas SD.") +
      row3("EN","Control","Reinicia el chip (equivalente al botón RESET de Arduino).") +
      row3("3V3 / GND","Alimentación","Igual que en cualquier placa: energía regulada y tierra común.") +
      '</tbody></table>' +
      '<p class="body-text" style="margin-top:10px;"><em>Algunos pines (como el 6-11) están reservados para la memoria flash interna y no deben usarse para otra cosa.</em></p>'
  });

  sections.push({
    type:"content",
    kicker:"Placa 2 de 3", kickerColor:"esp32",
    title:"ESP32: usos comunes",
    html:
      '<div class="feature-grid">' +
        feature("01","Domótica y hogar inteligente","Interruptores y sensores conectados a una app.") +
        feature("02","Sensores IoT en la nube","Publicar lecturas por MQTT o HTTP.") +
        feature("03","Dispositivos wearables","Proyectos pequeños con conectividad Bluetooth.") +
        feature("04","Nodos de una red de sensores","Varios ESP32 reportando a una misma plataforma.") +
      '</div>' +
      '<div class="callout"><b>Ejemplo práctico</b>Un ESP32 con un sensor de temperatura que publica una lectura por MQTT cada minuto a una plataforma en la nube, sin necesitar ningún módulo adicional de Wi-Fi.</div>'
  });

  // ---------- RASPBERRY PI ----------
  sections.push({
    type:"content",
    kicker:"Placa 3 de 3", kickerColor:"rpi",
    title:"Raspberry Pi — el gerente que hace de todo",
    html:
      '<p class="body-text">Una computadora completa del tamaño de una tarjeta (SBC, Single Board Computer). Tiene un microprocesador de verdad y corre un sistema operativo (normalmente Linux), por lo que puede hacer casi cualquier cosa que haría una laptop.</p>' +
      '<div class="callout"><b>Analogía</b>Es como un gerente con oficina completa: puede coordinar varias tareas a la vez y tomar decisiones complejas, pero también necesita más recursos para trabajar.</div>' +
      '<div class="feature-grid">' +
        feature("64-bit","Microprocesador quad-core","SoC Broadcom, similar en concepto al de un celular.") +
        feature("1.5 GHz","Velocidad de reloj típica","Cifra de referencia en un modelo Raspberry Pi 4.") +
        feature("2-8 GB","RAM (según modelo)","Muchísima más memoria de trabajo que un microcontrolador.") +
        feature("OS","Sistema operativo completo","Normalmente Raspberry Pi OS, basado en Linux.") +
        feature("I/O","Puertos como una PC","HDMI, USB 2.0/3.0, Ethernet, además de 40 pines GPIO.") +
        feature("</>", "Casi cualquier lenguaje","Python es el más común; también corre otros.") +
      '</div>' +
      '<p class="body-text" style="margin-top:14px;"><em>A cambio de tanta capacidad, la Raspberry Pi consume más energía y cuesta más que un Arduino o un ESP32.</em></p>' +

  // ---------- Estado ----------
  var idx = 0;
  var answers = {}; // qIndex-in-sections -> {selected, correct}
  var STORE_KEY = "placas_iot_progreso_v1";

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var d = JSON.parse(raw);
        if(typeof d.idx === "number") idx = Math.min(d.idx, sections.length-1);
        if(d.answers) answers = d.answers;
      }
    }catch(e){}
  }
  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify({idx:idx, answers:answers})); }catch(e){}
  }

  function totalQuestions(){
    return sections.filter(function(s){return s.type==="question";}).length;
  }
  function correctCount(){
    var c=0;
    Object.keys(answers).forEach(function(k){ if(answers[k].correct) c++; });
    return c;
  }

    stage.innerHTML = "";

      wrap.innerHTML =

          '</div>'+
        '</div>';
    }
    else if(s.type === "content"){
      var kk = s.kickerColor ? ' style="color:var(--'+s.kickerColor+')"' : '';
      wrap.innerHTML =
        '<div class="kicker mono"'+kk+'><b>'+s.kicker+'</b></div>'+
        '<h2 class="title serif">'+s.title+'</h2>'+
        s.html;
    }
    else if(s.type === "question"){
      var qid = idx;
      var prevAnswer = answers[qid];
      var color = s.color || "dark";
      wrap.innerHTML =
        '<div class="qbox">'+
          '<span class="qtag mono" style="background:var(--'+color+')">'+s.tag+'</span>'+
          '<p class="qprompt">'+s.prompt+'</p>'+
          '<div class="options" id="optList"></div>'+
          '<div class="feedback" id="fb"></div>'+
        '</div>';
      stage.appendChild(wrap);
      var optList = wrap.querySelector("#optList");
      var fb = wrap.querySelector("#fb");
      var letters = ["A","B","C","D","E"];
      s.options.forEach(function(opt, i){
        var row = document.createElement("div");
        row.className = "option";
        row.innerHTML = '<span class="letter">'+letters[i]+'</span><span>'+opt+'</span>';
        row.addEventListener("click", function(){
          if(answers[qid]) return; // ya respondida
          var isCorrect = (i === s.correct);
          answers[qid] = { selected:i, correct:isCorrect };
          saveState();
          paintOptions();
          showFeedback();
          updateNav();
          updateProgress();
        });
        optList.appendChild(row);
      });
      function paintOptions(){
        var rows = optList.querySelectorAll(".option");
        var a = answers[qid];
        for(var ri=0; ri<rows.length; ri++){
          var r = rows[ri];
          r.classList.remove("selected","correct","incorrect");
          if(a){
            r.classList.add("disabled");
            if(ri === s.correct) r.classList.add("correct");
            else if(ri === a.selected) r.classList.add("incorrect");
          }
        }
      }
      function showFeedback(){
        var a = answers[qid];
        if(!a) return;
        fb.className = "feedback show " + (a.correct ? "ok":"no");
        fb.innerHTML = "<b>" + (a.correct ? "Correcto." : "No exactamente.") + "</b>" + s.explain;
      }
      if(prevAnswer){ paintOptions(); showFeedback(); }
    }

        var markOk = a && a.correct;
        row.innerHTML = '<span class="mark '+(markOk?"ok":"no")+'">'+(markOk?"✓":"✕")+'</span><span>'+sec.prompt+'</span>';
        list.appendChild(row);
      });
      wrap.querySelector("#restartBtn").addEventListener("click", function(){
        answers = {}; idx = 0; saveState(); render();
      });
    }

    if(s.type !== "question" && s.type !== "final"){ stage.appendChild(wrap); }
    updateNav();
    updateProgress();
    window.scrollTo(0,0);
  }

  function updateNav(){
    prevBtn.disabled = (idx === 0);
    var s = sections[idx];
    if(s.type === "final"){
      nextBtn.textContent = "Volver al inicio →";
      nextBtn.disabled = false;
    } else {
      nextBtn.textContent = "Siguiente →";
      nextBtn.disabled = false;
    }
    if(s.type === "question" && !answers[idx]){
      navHint.textContent = "Elige una opción para continuar";
    } else {
      navHint.textContent = "";
    }
  }

  function updateProgress(){
    var pct = Math.round((idx) / (sections.length-1) * 100);
    progressFill.style.width = pct + "%";
    progressLabel.textContent = idx + " / " + (sections.length-1);
  }

  function finalMessage(got,total){
    var pct = got/total;
    if(pct === 1) return "¡Excelente! Dominas la diferencia entre las 3 placas y cuándo usar cada una.";
    if(pct >= 0.7) return "Buen trabajo. Revisa las preguntas marcadas para reforzar antes de la práctica con hardware.";
    return "Vale la pena repasar la sección de comparación antes de la práctica con hardware real o simulador.";
  }

  prevBtn.addEventListener("click", function(){
    if(idx>0){ idx--; saveState(); render(); }
  });
  nextBtn.addEventListener("click", function(){
    var s = sections[idx];
    if(s.type === "final"){ idx = 0; saveState(); render(); return; }
    if(idx < sections.length-1){ idx++; saveState(); render(); }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight" && !nextBtn.disabled) nextBtn.click();
    if(e.key === "ArrowLeft" && !prevBtn.disabled) prevBtn.click();
  });

  loadState();
  render();
})();
</script>
</body>
</html>
